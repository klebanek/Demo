<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keto</title>
  <meta name="description" content="Dziennik wagi, tkanki tłuszczowej i aktywności.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Keto">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="eyebrow" id="today"></p>
      <h1>Keto</h1>
    </header>

    <section class="card hero" id="hero" aria-live="polite"></section>
    <section class="stats" id="stats"></section>

    <section class="card" aria-labelledby="chartTitle">
      <div class="card-head">
        <h2 id="chartTitle">Wykres</h2>
        <div class="seg" role="group" aria-label="Wielkość na wykresie">
          <button data-key="metric" data-val="weight">Waga</button>
          <button data-key="metric" data-val="fat">Tłuszcz</button>
        </div>
      </div>
      <div class="chart-meta" id="chartMeta"></div>
      <div class="chart" id="chart"></div>
      <div class="seg wide" role="group" aria-label="Zakres czasu">
        <button data-key="range" data-val="7">7 dni</button>
        <button data-key="range" data-val="30">30 dni</button>
        <button data-key="range" data-val="90">90 dni</button>
        <button data-key="range" data-val="all">Wszystko</button>
      </div>
      <div class="mini" id="chartStats"></div>
    </section>

    <section class="card" aria-labelledby="logTitle">
      <div class="card-head">
        <h2 id="logTitle">Dziennik</h2>
        <div class="seg" role="group" aria-label="Tabela">
          <button data-key="tab" data-val="m">Pomiary</button>
          <button data-key="tab" data-val="a">Aktywności</button>
        </div>
      </div>
      <div class="log-summary" id="logSummary"></div>
      <div class="table-wrap" id="table"></div>
    </section>

    <section class="card data-card" aria-labelledby="dataTitle">
      <h2 id="dataTitle">Dane</h2>
      <p class="muted">Wszystko zapisuje się lokalnie w tej przeglądarce. Zrób kopię, żeby nic nie zginęło.</p>
      <div class="data-actions">
        <button class="plain" id="exportBtn">Eksportuj kopię</button>
        <button class="plain" id="importBtn">Importuj</button>
        <button class="plain danger" id="resetBtn">Usuń wszystko</button>
      </div>
    </section>
  </main>

  <nav class="dock" aria-label="Szybkie akcje">
    <div class="dock-inner">
      <button class="btn primary" id="addM">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Dodaj pomiar
      </button>
      <button class="btn tinted" id="addA">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        Dodaj aktywność
      </button>
    </div>
  </nav>

  <dialog id="sheet" aria-labelledby="sheetTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js" defer></script>
</body>
</html>
